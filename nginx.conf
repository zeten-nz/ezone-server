# ============================================================
# NGINX CONFIGURATION — EZONE WARRANTY MANAGEMENT SYSTEM
# ============================================================
# Location on server:  /etc/nginx/sites-available/ezone
# Enable with:         sudo ln -s /etc/nginx/sites-available/ezone /etc/nginx/sites-enabled/ezone
#                      sudo nginx -t && sudo systemctl reload nginx
#
# Assumes:
#   • Node.js API running on localhost:5000 (via PM2)
#   • React frontend built to /var/www/ezone/frontend/dist
#   • SSL certificate obtained via: sudo certbot --nginx -d yourdomain.com
# ============================================================

# ── Upstream (Node.js backend) ────────────────────────────────
# Defining an upstream block lets Nginx load-balance across multiple Node
# processes if needed, and gives a clean name to use in proxy_pass.
upstream ezone_api {
    server 127.0.0.1:5000;

    # For multiple PM2 instances on different ports, add:
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;

    # Use keepalive to reuse TCP connections to Node instead of creating
    # a new connection for every proxied request (significant performance win).
    keepalive 64;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge (needed for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL / TLS ─────────────────────────────────────────────
    # Paths filled in automatically by: sudo certbot --nginx -d yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Only allow modern TLS versions (TLS 1.3 preferred, 1.2 for older clients)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Prefer server cipher order for TLS 1.2 (TLS 1.3 negotiates automatically)
    ssl_prefer_server_ciphers off;

    # Session resumption reduces TLS handshake cost for returning clients
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — server fetches and caches the cert revocation status
    # so clients don't need to query the CA on every connection
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ── Security headers ──────────────────────────────────────
    # These complement the Helmet headers set by Node.js.
    # Nginx sets them for static file responses that never touch Node.

    # Prevent clickjacking (embedding your site in an iframe on another domain)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Block MIME-type sniffing (prevents .txt files from being run as scripts)
    add_header X-Content-Type-Options "nosniff" always;

    # HSTS — tell browsers to always use HTTPS for this domain for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Control what information is sent in the Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request size ──────────────────────────────────────────
    # Must be at least as large as the limit in express.json (10 MB)
    client_max_body_size 10M;

    # ── Timeouts ──────────────────────────────────────────────
    # Excel export can take several seconds for large datasets
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    120s;

    # ── Gzip compression ──────────────────────────────────────
    # Nginx can also compress responses. Node.js (compression middleware)
    # handles API JSON; Nginx handles static files served directly.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Health check endpoint ─────────────────────────────────
    # Don't log health check hits — they happen every few seconds and
    # would pollute the access log.
    location /health {
        proxy_pass         http://ezone_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── API proxy ─────────────────────────────────────────────
    # All /api/* requests are forwarded to Node.js.
    # X-Real-IP and X-Forwarded-For are needed so Node.js (and its rate
    # limiter) sees the real client IP, not 127.0.0.1.
    location /api/ {
        proxy_pass         http://ezone_api;
        proxy_http_version 1.1;

        # Required for keepalive connections (see upstream block above)
        proxy_set_header   Connection        "";

        # Real client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable proxy-level response buffering for streaming downloads
        # (Excel files are streamed directly from exceljs)
        proxy_buffering    off;
    }

    # ── React frontend — static files ─────────────────────────
    # Serve the Vite build output directly from disk.
    # Nginx is far more efficient at serving static files than Node.js.
    root  /var/www/ezone/frontend/dist;
    index index.html;

    location / {
        # SPA routing: if the file doesn't exist on disk, serve index.html
        # so React Router can handle the URL on the client side.
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for Vite hashed asset files
    # Vite appends a content hash to each filename (e.g. main.abc123.js),
    # so these files can be cached for 1 year without stale-content risk.
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/ezone_access.log;
    error_log  /var/log/nginx/ezone_error.log  warn;
}
